<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F1C42" />
      <stop offset="60%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#040918" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFEE8" />
      <stop offset="20%" stop-color="#FDE47F" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FFF2A8" />
      <stop offset="85%" stop-color="#C6941A" />
      <stop offset="100%" stop-color="#7A4D05" />
    </linearGradient>

    <!-- Deep Burnished Gold -->
    <linearGradient id="goldDeep" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="50%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#4A2F02" />
    </linearGradient>

    <!-- Left Wing Saffron / Orange Crystalline Gradient -->
    <linearGradient id="saffronWing" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFDD80" />
      <stop offset="25%" stop-color="#FF9933" />
      <stop offset="55%" stop-color="#FF671F" />
      <stop offset="85%" stop-color="#D35400" />
      <stop offset="100%" stop-color="#872200" />
    </linearGradient>

    <!-- Right Wing Emerald Green Crystalline Gradient -->
    <linearGradient id="greenWing" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="25%" stop-color="#34D399" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#046A38" />
      <stop offset="100%" stop-color="#023419" />
    </linearGradient>

    <!-- Crown Jewels -->
    <radialGradient id="jewelSaffron" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0A3" />
      <stop offset="40%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#992E00" />
    </radialGradient>
    <radialGradient id="jewelGreen" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="40%" stop-color="#046A38" />
      <stop offset="100%" stop-color="#012411" />
    </radialGradient>
    <radialGradient id="jewelDiamond" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>

    <!-- Shield Interior Deep Emerald Green -->
    <radialGradient id="shieldGreenBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0A3822" />
      <stop offset="70%" stop-color="#031F12" />
      <stop offset="100%" stop-color="#010D07" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" rx="160" fill="url(#bgGlow)" />
  <rect width="1016" height="1016" x="4" y="4" rx="156" fill="none" stroke="url(#gold24k)" stroke-width="6" opacity="0.4" />

  <!-- Outer Halo Rings -->
  <circle cx="512" cy="440" r="380" stroke="url(#gold24k)" stroke-width="4" stroke-dasharray="24 10" opacity="0.6" />
  <circle cx="512" cy="440" r="365" stroke="url(#goldDeep)" stroke-width="2" opacity="0.4" />

  <!-- LEFT WING: Vibrant Crystalline Saffron Feathers -->
  <g filter="url(#shadow)">
    <!-- Primary Outer Saffron Feathers -->
    <path d="M 370 520 C 270 480, 160 380, 150 260 C 145 210, 170 230, 190 270 C 210 310, 240 350, 270 370 C 240 320, 195 250, 195 220 C 195 198, 220 216, 244 260 C 268 304, 300 356, 320 380 C 290 316, 260 250, 270 200 C 276 176, 292 200, 312 250 C 336 304, 356 370, 370 420 Z"
          fill="url(#saffronWing)" stroke="#5C2500" stroke-width="3" />
    <!-- Secondary Saffron Feathers -->
    <path d="M 360 550 C 290 540, 200 470, 175 390 C 160 350, 186 360, 214 396 C 246 436, 294 476, 340 496 C 300 450, 240 370, 240 336 C 240 316, 262 332, 290 380 C 318 428, 350 476, 374 516 Z"
          fill="url(#saffronWing)" stroke="#5C2500" stroke-width="2.5" opacity="0.95" />
    <!-- Tertiary Inner Saffron Coverts -->
    <path d="M 386 600 C 330 610, 250 560, 220 500 C 206 470, 230 476, 260 504 C 294 536, 340 564, 380 580 C 340 540, 286 480, 294 456 C 300 440, 320 456, 346 490 C 374 524, 394 564, 406 596 Z"
          fill="url(#saffronWing)" stroke="#5C2500" stroke-width="2" opacity="0.9" />
  </g>

  <!-- RIGHT WING: Vibrant Crystalline Emerald Green Feathers -->
  <g filter="url(#shadow)">
    <!-- Primary Outer Green Feathers -->
    <path d="M 654 520 C 754 480, 864 380, 874 260 C 879 210, 854 230, 834 270 C 814 310, 784 350, 754 370 C 784 320, 829 250, 829 220 C 829 198, 804 216, 780 260 C 756 304, 724 356, 704 380 C 734 316, 764 250, 754 200 C 748 176, 732 200, 712 250 C 688 304, 668 370, 654 420 Z"
          fill="url(#greenWing)" stroke="#013B1B" stroke-width="3" />
    <!-- Secondary Green Feathers -->
    <path d="M 664 550 C 734 540, 824 470, 849 390 C 864 350, 838 360, 810 396 C 778 436, 730 476, 684 496 C 724 450, 784 370, 784 336 C 784 316, 762 332, 734 380 C 706 428, 674 476, 650 516 Z"
          fill="url(#greenWing)" stroke="#013B1B" stroke-width="2.5" opacity="0.95" />
    <!-- Tertiary Inner Green Coverts -->
    <path d="M 638 600 C 694 610, 774 560, 804 500 C 818 470, 794 476, 764 504 C 730 536, 684 564, 644 580 C 684 540, 738 480, 730 456 C 724 440, 704 456, 678 490 C 650 524, 630 564, 618 596 Z"
          fill="url(#greenWing)" stroke="#013B1B" stroke-width="2" opacity="0.9" />
  </g>

  <!-- CENTER INVERTED SHIELD CREST -->
  <g filter="url(#shadow)">
    <!-- Shield Outer Gold Rim -->
    <path d="M 320 270 L 704 270 L 674 460 L 512 730 L 350 460 Z"
          fill="url(#shieldGreenBg)" stroke="url(#gold24k)" stroke-width="12" stroke-linejoin="round" />
    <!-- Shield Inner Pinstripe Border -->
    <path d="M 344 286 L 680 286 L 652 452 L 512 696 L 372 452 Z"
          fill="none" stroke="url(#goldDeep)" stroke-width="4" opacity="0.8" />

    <!-- 3D FLUTED MMP MONOGRAM (Columns tapering to spear point) -->
    <g transform="translate(512, 380)">
      <!-- Top Connecting Crossbar -->
      <path d="M -150 -96 L 150 -96 L 150 -72 L -150 -72 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <!-- Left M Outer Leg -->
      <path d="M -150 -96 L -110 -30 L -110 70 L -130 40 L -130 -72 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <!-- Center Fluted Pillars -->
      <path d="M -96 -72 L -76 -72 L -76 50 L -86 68 L -96 50 Z" fill="url(#goldDeep)" stroke="#5C3B00" stroke-width="2" />
      <path d="M -60 -72 L -40 -72 L -40 90 L -50 110 L -60 90 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <path d="M -24 -72 L -4 -72 L -4 130 L -14 152 L -24 130 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <!-- Central Spear Column -->
      <path d="M 4 -72 L 24 -72 L 24 156 L 14 184 L 4 156 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <path d="M 40 -72 L 60 -72 L 60 130 L 50 152 L 40 130 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <path d="M 76 -72 L 96 -72 L 96 90 L 86 110 L 76 90 Z" fill="url(#goldDeep)" stroke="#5C3B00" stroke-width="2" />
      <!-- Right P Loop -->
      <path d="M 80 -96 L 150 -96 C 176 -96, 176 -30, 150 -30 L 80 -30 Z" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
      <path d="M 96 -80 L 140 -80 C 152 -80, 152 -46, 140 -46 L 96 -46 Z" fill="url(#shieldGreenBg)" stroke="url(#goldDeep)" stroke-width="2" />
    </g>
  </g>

  <!-- 3D GOLDEN HANDSHAKE AT CENTER -->
  <g filter="url(#shadow)">
    <!-- Left Hand & Ornate Winged Cuff -->
    <path d="M 370 680 C 400 660, 440 670, 470 690 L 502 712 C 510 718, 514 728, 506 736 C 498 744, 486 744, 474 736 L 440 716 L 400 700 Z"
          fill="url(#gold24k)" stroke="#5C3B00" stroke-width="3" />
    <!-- Right Hand & Ornate Winged Cuff -->
    <path d="M 654 680 C 624 660, 584 670, 554 690 L 522 712 C 514 718, 510 728, 518 736 C 526 744, 538 744, 550 736 L 584 716 L 624 700 Z"
          fill="url(#gold24k)" stroke="#5C3B00" stroke-width="3" />

    <!-- Clasping Hands Interlocking Fingers -->
    <ellipse cx="488" cy="720" rx="14" ry="11" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
    <ellipse cx="508" cy="724" rx="14" ry="11" fill="url(#goldDeep)" stroke="#5C3B00" stroke-width="2" />
    <ellipse cx="528" cy="724" rx="14" ry="11" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="2" />
    <ellipse cx="548" cy="716" rx="13" ry="10" fill="url(#goldDeep)" stroke="#5C3B00" stroke-width="2" />

    <!-- Knuckle Specular Highlights -->
    <circle cx="488" cy="716" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="508" cy="720" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="528" cy="720" r="4" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- 5-PEAK ROYAL GOLDEN CROWN ATOP THE CREST -->
  <g filter="url(#shadow)">
    <!-- Crown Base Rim -->
    <path d="M 360 230 Q 512 250 664 230 L 656 252 Q 512 272 368 252 Z"
          fill="url(#gold24k)" stroke="#5C3B00" stroke-width="3" />

    <!-- 5 Crown Spires -->
    <path d="M 360 230 L 350 150 L 410 184 L 512 96 L 614 184 L 674 150 L 664 230 Z"
          fill="url(#gold24k)" stroke="#5C3B00" stroke-width="4" stroke-linejoin="round" />

    <!-- 5 Golden Spherical Finials at Peak Tips -->
    <circle cx="350" cy="144" r="16" fill="url(#gold24k)" stroke="#FFF" stroke-width="2.5" />
    <circle cx="410" cy="180" r="13" fill="url(#gold24k)" stroke="#FFF" stroke-width="2" />
    <circle cx="512" cy="84" r="22" fill="url(#gold24k)" stroke="#FFF" stroke-width="3" />
    <circle cx="614" cy="180" r="13" fill="url(#gold24k)" stroke="#FFF" stroke-width="2" />
    <circle cx="674" cy="144" r="16" fill="url(#gold24k)" stroke="#FFF" stroke-width="2.5" />

    <!-- Finial Specular Highlights -->
    <circle cx="506" cy="76" r="7" fill="#FFFFFF" opacity="0.95" />
    <circle cx="346" cy="138" r="4.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="670" cy="138" r="4.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Crown Jewels (Tiranga Inspired: Saffron, White Diamond, Emerald) -->
    <!-- Center Saffron Ruby / Topaz -->
    <polygon points="512,216 528,232 512,248 496,232" fill="url(#jewelSaffron)" stroke="#FFF" stroke-width="2" />
    <!-- Flanking White Diamonds -->
    <polygon points="460,222 472,234 460,246 448,234" fill="url(#jewelDiamond)" stroke="#FFF" stroke-width="1.5" />
    <polygon points="564,222 576,234 564,246 552,234" fill="url(#jewelDiamond)" stroke="#FFF" stroke-width="1.5" />
    <!-- Flanking Emerald Jewels -->
    <circle cx="406" cy="234" r="11" fill="url(#jewelGreen)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="618" cy="234" r="11" fill="url(#jewelGreen)" stroke="#FFF" stroke-width="1.5" />
    <!-- Outer Saffron Jewels -->
    <circle cx="372" cy="236" r="8" fill="url(#jewelSaffron)" stroke="#FFF" stroke-width="1" />
    <circle cx="652" cy="236" r="8" fill="url(#jewelSaffron)" stroke="#FFF" stroke-width="1" />
  </g>

  <!-- TYPOGRAPHY: DUAL-TONE "MANPOWER" (MAN: Saffron, POWER: Emerald Green) -->
  <g filter="url(#shadow)">
    <!-- Text Shadow Base -->
    <text x="320" y="836" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="78" letter-spacing="4" fill="#000000" stroke="#000000" stroke-width="10" text-anchor="middle">MAN</text>
    <text x="660" y="836" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="78" letter-spacing="4" fill="#000000" stroke="#000000" stroke-width="10" text-anchor="middle">POWER</text>

    <!-- "MAN" in Radiant Crystalline Saffron -->
    <text x="320" y="834" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="78" letter-spacing="4" fill="url(#saffronWing)" stroke="url(#gold24k)" stroke-width="2.5" text-anchor="middle">MAN</text>

    <!-- "POWER" in Radiant Crystalline Emerald Green -->
    <text x="660" y="834" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="78" letter-spacing="4" fill="url(#greenWing)" stroke="url(#gold24k)" stroke-width="2.5" text-anchor="middle">POWER</text>

    <!-- LINE 2: — SERVICES — in Spaced Gold -->
    <!-- Left Decorative Flourish -->
    <line x1="210" y1="886" x2="370" y2="886" stroke="url(#gold24k)" stroke-width="4" stroke-linecap="round" />
    <polygon points="370,886 360,881 360,891" fill="url(#gold24k)" />

    <text x="512" y="896" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="44" letter-spacing="18" fill="url(#gold24k)" stroke="#5C3B00" stroke-width="1" text-anchor="middle">SERVICES</text>

    <!-- Right Decorative Flourish -->
    <polygon points="654,886 664,881 664,891" fill="url(#gold24k)" />
    <line x1="654" y1="886" x2="814" y2="886" stroke="url(#gold24k)" stroke-width="4" stroke-linecap="round" />

    <!-- LINE 3: OFFICIAL NEW TAGLINE -->
    <!-- Center Green Diamond -->
    <polygon points="512,940 522,950 512,960 502,950" fill="url(#jewelGreen)" stroke="url(#gold24k)" stroke-width="2" />
    <!-- Flourish sprigs -->
    <path d="M 496 950 Q 470 944 440 950" stroke="url(#gold24k)" stroke-width="2" fill="none" />
    <path d="M 528 950 Q 554 944 584 950" stroke="url(#gold24k)" stroke-width="2" fill="none" />

    <text x="512" y="980" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="24" letter-spacing="5" fill="#FFFFFF" text-anchor="middle">YOUR WORKFORCE. OUR STRENGTH. YOUR SUCCESS.</text>

    <!-- Tricolor Base Line (Saffron, White, Green) -->
    <line x1="220" y1="1004" x2="414" y2="1004" stroke="#FF671F" stroke-width="4" stroke-linecap="round" />
    <line x1="418" y1="1004" x2="606" y2="1004" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="512" cy="1004" r="5" fill="#D4AF37" />
    <line x1="610" y1="1004" x2="804" y2="1004" stroke="#046A38" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
